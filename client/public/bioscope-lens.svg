<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="brassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="lensGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </radialGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Brass Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#brassGlow)" stroke-width="3.5" fill="#0c0e14" />
  
  <!-- Decorative Notch Ring (Vintage Bioscope Barrel) -->
  <circle cx="50" cy="50" r="41" stroke="#92400e" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Inner Viewing Chamber -->
  <circle cx="50" cy="50" r="36" fill="url(#lensGlow)" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Iris Aperture Blades -->
  <path d="M50 20 L62 42 L42 42 Z" fill="#78350f" opacity="0.5" />
  <path d="M76 40 L60 58 L52 40 Z" fill="#78350f" opacity="0.5" />
  <path d="M68 70 L46 68 L56 50 Z" fill="#78350f" opacity="0.5" />
  <path d="M34 70 L34 48 L52 58 Z" fill="#78350f" opacity="0.5" />
  <path d="M24 42 L46 36 L36 56 Z" fill="#78350f" opacity="0.5" />

  <!-- Optical Center Lens -->
  <circle cx="50" cy="50" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
  <circle cx="50" cy="50" r="8" fill="#fbbf24" opacity="0.85" filter="url(#cinematicGlow)" />
  <circle cx="47" cy="47" r="3" fill="#ffffff" opacity="0.9" />

  <!-- Bioscope Top Film Crank -->
  <rect x="47" y="1" width="6" height="5" rx="1.5" fill="url(#brassGlow)" />
  <circle cx="50" cy="2" r="2.5" fill="#fef3c7" />

  <!-- Bioscope Side Turn Pegs -->
  <rect x="0" y="47" width="5" height="6" rx="1.5" fill="url(#brassGlow)" />
  <rect x="95" y="47" width="5" height="6" rx="1.5" fill="url(#brassGlow)" />
</svg>
